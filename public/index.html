<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Availability Calendar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 { font-size: 26px; margin-bottom: 4px; }
    header p { opacity: 0.85; font-size: 14px; }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 0;
      background: #2c3e50;
    }

    .tab-btn {
      padding: 14px 32px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: rgba(255,255,255,0.9);
    }

    .tab-btn.active {
      color: white;
      border-bottom-color: #3498db;
      background: rgba(255,255,255,0.1);
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px;
      overflow-x: hidden;
    }

    /* Legend */
    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .legend-dot.available { background: #e8f5e9; border: 1px solid #a5d6a7; }
    .legend-dot.airbnb { background: #ffcdd2; border: 1px solid #ef9a9a; }
    .legend-dot.bookingcom { background: #bbdefb; border: 1px solid #90caf9; }
    .legend-dot.direct { background: #e1bee7; border: 1px solid #ce93d8; }
    .legend-dot.blocked { background: #e0e0e0; border: 1px solid #bdbdbd; }
    .legend-dot.reserved { background: #ffcdd2; border: 1px solid #ef9a9a; }
    .legend-dot.today-dot { background: white; border: 2px solid #3498db; }

    /* Calendar Navigation */
    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .calendar-nav button {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .calendar-nav button:hover { background: #2980b9; }
    .calendar-nav h2 { font-size: 22px; }

    /* Calendar */
    .calendar {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #34495e;
      color: white;
    }

    .calendar-header div {
      padding: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
    }

    .calendar-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day {
      min-height: 64px;
      padding: 6px;
      border: 1px solid #eee;
      position: relative;
      overflow: hidden;
    }

    .day.empty { background: #fafafa; }

    .day .day-number {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .day.today { border: 2px solid #3498db; }

    .day.past { opacity: 0.4; }

    .day.available { background: #e8f5e9; }

    .day.reserved-airbnb { background: #ffcdd2; }
    .day.reserved-bookingcom { background: #bbdefb; }
    .day.reserved-direct { background: #e1bee7; }
    .day.reserved { background: #ffcdd2; }
    .day.blocked { background: #e0e0e0; }

    .day .tag {
      font-size: 9px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 3px;
      color: white;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .tag.airbnb { background: #e53935; }
    .tag.bookingcom { background: #1565c0; }
    .tag.direct { background: #8e24aa; }
    .tag.reserved { background: #e53935; }

    .day .status-text {
      font-size: 10px;
      margin-top: 2px;
      color: #555;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: #888;
    }

    /* Refresh button */
    .refresh-btn {
      display: block;
      margin: 0 auto 24px;
      background: #27ae60;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .refresh-btn:hover { background: #219a52; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">屈斜路湖サウナ倶楽部</h1>
    <p id="headerSub">Near Lake Kussharo, Hokkaido - Availability Calendar</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('sauna')">屈斜路湖サウナ倶楽部</button>
    <button class="tab-btn" onclick="switchTab('tapkop')">TAPKOP</button>
  </div>

  <div class="container">

    <div class="legend" id="legend"></div>

    <div class="calendar-nav">
      <button onclick="changeMonth(-1)">&larr; Prev</button>
      <h2 id="monthTitle"></h2>
      <button onclick="changeMonth(1)">Next &rarr;</button>
    </div>

    <div class="calendar">
      <div class="calendar-header">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="calendar-body" id="calendarBody">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <button class="refresh-btn" onclick="loadBookings()">Refresh Bookings</button>
  </div>

  <script>
    var currentYear, currentMonth;
    var bookings = [];
    var currentTab = "sauna";

    var MONTH_NAMES = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    var TABS = {
      sauna: {
        title: "屈斜路湖サウナ倶楽部",
        subtitle: "Near Lake Kussharo, Hokkaido - Availability Calendar",
        api: "/api/bookings",
        legend: [
          { cls: "available", label: "Available" },
          { cls: "airbnb", label: "Airbnb" },
          { cls: "bookingcom", label: "Booking.com" },
          { cls: "direct", label: "Direct" },
          { cls: "blocked", label: "Blocked" },
          { cls: "today-dot", label: "Today" }
        ]
      },
      tapkop: {
        title: "TAPKOP",
        subtitle: "Availability Calendar",
        api: "/api/tapkop",
        legend: [
          { cls: "available", label: "Available" },
          { cls: "reserved", label: "Reserved" },
          { cls: "today-dot", label: "Today" }
        ]
      }
    };

    function init() {
      var now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      switchTab("sauna");
    }

    function switchTab(tab) {
      currentTab = tab;
      var config = TABS[tab];

      document.getElementById("headerTitle").textContent = config.title;
      document.getElementById("headerSub").textContent = config.subtitle;

      var btns = document.querySelectorAll(".tab-btn");
      btns.forEach(function (btn) { btn.classList.remove("active"); });
      if (tab === "sauna") btns[0].classList.add("active");
      else btns[1].classList.add("active");

      var legendEl = document.getElementById("legend");
      legendEl.innerHTML = "";
      config.legend.forEach(function (item) {
        var div = document.createElement("div");
        div.className = "legend-item";
        div.innerHTML = '<div class="legend-dot ' + item.cls + '"></div> ' + item.label;
        legendEl.appendChild(div);
      });

      loadBookings();
    }

    function loadBookings() {
      var config = TABS[currentTab];
      document.getElementById("calendarBody").innerHTML =
        '<div class="loading">Loading...</div>';

      fetch(config.api)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          bookings = data;
          renderCalendar();
        })
        .catch(function (err) {
          document.getElementById("calendarBody").innerHTML =
            '<div class="loading">Error loading bookings. Please try again.</div>';
          console.error(err);
        });
    }

    function findBooking(dateStr) {
      var date = new Date(dateStr);
      for (var i = 0; i < bookings.length; i++) {
        var checkIn = new Date(bookings[i].checkIn);
        var checkOut = new Date(bookings[i].checkOut);
        if (currentTab === "tapkop") {
          if (bookings[i].checkIn === dateStr) return bookings[i];
        } else {
          if (date >= checkIn && date < checkOut) return bookings[i];
        }
      }
      return null;
    }

    function renderCalendar() {
      document.getElementById("monthTitle").textContent =
        MONTH_NAMES[currentMonth] + " " + currentYear;

      var body = document.getElementById("calendarBody");
      body.innerHTML = "";

      var firstDay = new Date(currentYear, currentMonth, 1).getDay();
      var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      var today = new Date();
      today.setHours(0, 0, 0, 0);

      for (var i = 0; i < firstDay; i++) {
        var empty = document.createElement("div");
        empty.className = "day empty";
        body.appendChild(empty);
      }

      for (var d = 1; d <= daysInMonth; d++) {
        var cell = document.createElement("div");
        cell.className = "day";

        var dateStr =
          currentYear +
          "-" +
          String(currentMonth + 1).padStart(2, "0") +
          "-" +
          String(d).padStart(2, "0");

        var cellDate = new Date(dateStr);
        cellDate.setHours(0, 0, 0, 0);

        var booking = findBooking(dateStr);

        if (
          today.getFullYear() === currentYear &&
          today.getMonth() === currentMonth &&
          today.getDate() === d
        ) {
          cell.classList.add("today");
        }

        if (cellDate < today) {
          cell.classList.add("past");
        }

        var num = document.createElement("div");
        num.className = "day-number";
        num.textContent = d;
        cell.appendChild(num);

        if (booking) {
          if (currentTab === "tapkop") {
            cell.classList.add("reserved");
            var tag = document.createElement("span");
            tag.className = "tag reserved";
            tag.textContent = "Reserved";
            cell.appendChild(tag);
          } else if (booking.type === "reserved") {
            var otaClass = "airbnb";
            var otaLabel = "Airbnb";
            if (booking.ota === "booking.com") { otaClass = "bookingcom"; otaLabel = "Booking"; }
            else if (booking.ota === "direct") { otaClass = "direct"; otaLabel = "Direct"; }

            cell.classList.add("reserved-" + otaClass);

            var tag2 = document.createElement("span");
            tag2.className = "tag " + otaClass;
            tag2.textContent = otaLabel;
            cell.appendChild(tag2);
          } else {
            cell.classList.add("blocked");

            var status2 = document.createElement("div");
            status2.className = "status-text";
            status2.textContent = "Blocked";
            cell.appendChild(status2);
          }
        } else if (cellDate >= today) {
          cell.classList.add("available");
        }

        body.appendChild(cell);
      }
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      else if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      if (currentTab === "tapkop") {
        loadBookings();
      } else {
        renderCalendar();
      }
    }

    init();
  </script>
</body>
</html>
